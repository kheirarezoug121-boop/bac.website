<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مقرأة الأترجّة — حفظ ومراجعة القرآن الكريم للأخوات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF1E4;
    --cream-deep:#F5E7D4;
    --pink:#F3C7CD;
    --pink-soft:#F8DDE1;
    --pink-deep:#EDB0BA;
    --blue:#B9CBE9;
    --blue-soft:#D6E1F2;
    --blue-deep:#9FB8E2;
    --mauve:#6E4A5A;
    --mauve-deep:#4E3340;
    --coral:#EAA6AD;
    --coral-deep:#D68F97;
    --gold:#E3A857;
    --gold-deep:#CF8E38;
    --white:#FFFDFB;
    --ink:#3F2C35;
    --font-display:'Baloo Bhaijaan 2','Tajawal',Tahoma,Arial,sans-serif;
    --font-body:'Tajawal',Tahoma,Arial,sans-serif;
  }

  *{box-sizing:border-box;}

  html{
    scroll-behavior:smooth;
  }

  body{
    margin:0;
    font-family:var(--font-body);
    background:var(--cream);
    color:var(--ink);
    overflow-x:hidden;
  }

  h1,h2,h3,h4{
    font-family:var(--font-display);
    color:var(--mauve-deep);
    margin:0;
  }

  p{line-height:1.9;}
  a{color:inherit;text-decoration:none;}
  ul{margin:0;padding:0;list-style:none;}
  button{font-family:var(--font-body);cursor:pointer;border:none;}
  img{max-width:100%;display:block;}

  /* decorative blobs */
  .blob{
    position:absolute;
    border-radius:58% 42% 65% 35% / 45% 55% 45% 55%;
    pointer-events:none;
    z-index:0;
  }

  .blob-pink{background:var(--pink);}
  .blob-blue{background:var(--blue);}

  .wrap{
    max-width:1240px;
    margin:0 auto;
    padding:0 24px;
    position:relative;
    z-index:1;
  }

  /* =====================================================
     MODERN MOTION LAYER
     إضافة حركية فقط - بدون تغيير محتوى الموقع
     ===================================================== */

  .motion-layer{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    overflow:hidden;
    pointer-events:none;
    z-index:0;
  }

  .motion-layer .float-icon{
    position:absolute;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--mauve);
    opacity:.18;
    will-change:transform;
  }

  .motion-layer .float-icon svg{
    width:100%;
    height:100%;
    fill:none;
    stroke:currentColor;
    stroke-width:1.35;
    stroke-linecap:round;
    stroke-linejoin:round;
  }

  .motion-layer .icon-book{
    width:42px;
    height:42px;
    top:18%;
    right:7%;
    animation:floatOne 8s ease-in-out infinite;
  }

  .motion-layer .icon-star{
    width:25px;
    height:25px;
    top:31%;
    right:17%;
    color:var(--gold-deep);
    animation:twinkleFloat 5s ease-in-out infinite;
    animation-delay:1s;
  }

  .motion-layer .icon-leaf{
    width:38px;
    height:38px;
    top:58%;
    right:6%;
    color:var(--coral-deep);
    animation:floatTwo 10s ease-in-out infinite;
    animation-delay:2s;
  }

  .motion-layer .icon-flower{
    width:35px;
    height:35px;
    top:76%;
    right:18%;
    color:var(--pink-deep);
    animation:rotateFloat 12s ease-in-out infinite;
  }

  .motion-layer .icon-book-two{
    width:36px;
    height:36px;
    top:43%;
    left:7%;
    color:var(--blue-deep);
    animation:floatTwo 9s ease-in-out infinite;
    animation-delay:3s;
  }

  .motion-layer .icon-star-two{
    width:23px;
    height:23px;
    top:67%;
    left:16%;
    color:var(--gold-deep);
    animation:twinkleFloat 6s ease-in-out infinite;
    animation-delay:1.5s;
  }

  .motion-layer .icon-leaf-two{
    width:40px;
    height:40px;
    top:25%;
    left:9%;
    color:var(--coral-deep);
    animation:floatOne 11s ease-in-out infinite;
    animation-delay:4s;
  }

  .motion-layer .icon-spark{
    width:20px;
    height:20px;
    top:84%;
    left:8%;
    color:var(--gold);
    animation:twinkle 4s ease-in-out infinite;
  }

  .motion-layer .soft-orb{
    position:absolute;
    border-radius:50%;
    filter:blur(1px);
    opacity:.12;
  }

  .motion-layer .orb-one{
    width:150px;
    height:150px;
    background:var(--pink);
    top:35%;
    right:-80px;
    animation:orbMove 16s ease-in-out infinite alternate;
  }

  .motion-layer .orb-two{
    width:180px;
    height:180px;
    background:var(--blue);
    bottom:8%;
    left:-100px;
    animation:orbMoveTwo 19s ease-in-out infinite alternate;
  }

  @keyframes floatOne{
    0%,100%{
      transform:translate3d(0,0,0) rotate(-4deg);
    }
    25%{
      transform:translate3d(-10px,-18px,0) rotate(4deg);
    }
    50%{
      transform:translate3d(7px,-30px,0) rotate(-2deg);
    }
    75%{
      transform:translate3d(14px,-13px,0) rotate(6deg);
    }
  }

  @keyframes floatTwo{
    0%,100%{
      transform:translate3d(0,0,0) rotate(5deg);
    }
    30%{
      transform:translate3d(12px,-14px,0) rotate(-5deg);
    }
    60%{
      transform:translate3d(-8px,-28px,0) rotate(7deg);
    }
    80%{
      transform:translate3d(-15px,-10px,0) rotate(-3deg);
    }
  }

  @keyframes rotateFloat{
    0%,100%{
      transform:translateY(0) rotate(0deg);
    }
    50%{
      transform:translateY(-24px) rotate(18deg);
    }
  }

  @keyframes twinkle{
    0%,100%{
      opacity:.12;
      transform:scale(.8) rotate(0deg);
    }
    50%{
      opacity:.55;
      transform:scale(1.25) rotate(20deg);
    }
  }

  @keyframes twinkleFloat{
    0%,100%{
      opacity:.12;
      transform:translateY(0) scale(.85) rotate(0deg);
    }
    50%{
      opacity:.55;
      transform:translateY(-22px) scale(1.2) rotate(25deg);
    }
  }

  @keyframes orbMove{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-45px,30px) scale(1.12);}
    100%{transform:translate(25px,-25px) scale(.95);}
  }

  @keyframes orbMoveTwo{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(55px,-35px) scale(1.08);}
    100%{transform:translate(-20px,20px) scale(.94);}
  }

  /* ظهور العناصر بشكل ناعم عند
